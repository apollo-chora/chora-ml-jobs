[project]
name = "chora-ml-jobs"
version = "0.1.0"
description = "Chora ML batch jobs — drift detection, model evaluation, billing aggregation"
requires-python = ">=3.13"
dependencies = [
    "mlflow>=2.15",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    # NATS JetStream — the local, cloud-neutral message bus that replaces
    # Google Cloud Pub/Sub. Alert events (chora.ml.drift_detected,
    # chora.ml.model_eval_regression) are published to the chora.ml.alerts
    # subject with the event envelope as message headers.
    "nats-py>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chora_ml_jobs"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "mlflow",
    "mlflow.*",
    "psycopg2",
    "psycopg2.*",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "nats",
    "nats.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
